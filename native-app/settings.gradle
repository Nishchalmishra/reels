pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://jitpack.io' }
        maven { url = "https://maven.mozilla.org/maven2/" }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = "https://maven.mozilla.org/maven2/" }

        flatDir {
            dirs("app/libs")
        }
    }
}

include ':app'
if (file('baselineprofile').exists()) include ':baselineprofile'
rootProject.name = "arivihan"