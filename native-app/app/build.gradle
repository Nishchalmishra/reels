if (!providers.gradleProperty('demoOnly').getOrElse('true').toBoolean()) apply plugin: 'com.google.gms.google-services'
if (!providers.gradleProperty('demoOnly').getOrElse('true').toBoolean()) apply plugin: 'com.google.firebase.crashlytics'
if (!providers.gradleProperty('demoOnly').getOrElse('true').toBoolean()) apply plugin: 'com.google.firebase.firebase-perf'

// This workspace copy is demo-only; production signing/services are intentionally unavailable.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (providers.gradleProperty('demoOnly').getOrElse('true').toBoolean())
            variant.enable = variant.productFlavors.any { it.second == 'demo' } && variant.buildType == 'debug'
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
