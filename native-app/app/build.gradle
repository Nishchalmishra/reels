plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'androidx.room'
    id 'androidx.baselineprofile'
}

android {
    def enableCrashlyticsInDebugBuild = false
    def enableCrashlyticsInReleaseBuild = true

    // ── Environment URLs ────────────────────────────────────────────────
    def devBaseUrl = '"https://backend-dev.arivihan.com/arivihan-platform"'
    def dev2BaseUrl = '"https://backend-dev2.arivihan.com/arivihan-platform"'
    def stageBaseUrl = '"https://backend-stage.arivihan.com/arivihan-platform"'
    def stage2BaseUrl = '"https://backend-stage2.arivihan.com/arivihan-platform"'
    def prodBaseUrl = '"https://platform-prod.arivihan.com/arivihan-platform"'

    // secret properties
    def secretPropsFile = rootProject.file("secrete.properties")
    def secretProps = new Properties()
    if (secretPropsFile.exists()) {
        secretProps.load(new FileInputStream(secretPropsFile))
    } else {
        throw new GradleException("Missing secrete.properties file in project root!")
    }

    flavorDimensions += "env"
    defaultConfig {
        applicationId "arivihan.technologies.doubtbuzzter2"
        minSdkVersion 23
        //noinspection OldTargetApi later
        targetSdkVersion 36
        compileSdk 36

        versionCode 637
        versionName "2.23.66"

        multiDexEnabled = true
        buildConfigField 'boolean', 'REELS_DEMO', 'false'
        def demoProps = new Properties()
        def demoConfig = rootProject.file('demo.properties')
        if (demoConfig.exists()) demoProps.load(new FileInputStream(demoConfig))
        buildConfigField 'String', 'REELS_SUPABASE_URL', '"' + demoProps.getProperty('SUPABASE_URL', '') + '"'
        buildConfigField 'String', 'REELS_SUPABASE_KEY', '"' + demoProps.getProperty('SUPABASE_PUBLISHABLE_KEY', '') + '"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
                SECREAT_KEY    : 'SECREAT_KEY',
                SECRET_KEY_PROD: 'SECRET_KEY_PROD',
                API_KEY        : 'API_KEY',
                CLARITY_ID     : 'CLARITY_ID'
        ]
        resourceConfigurations += ['en', 'hi']

        vectorDrawables.useSupportLibrary = false

        resValue "string", "facebook_app_id", "\"" + getFacebookAppId() + "\""
        resValue "string", "facebook_client_token", "\"" + getFacebookClientToken() + "\""
        resValue "string", "true_caller_client_id", "\"" + getTrueCallerClientId() + "\""
        resValue "string", "branch_key_live", "\"" + getBranchKeyLive() + "\""
        resValue "string", "branch_key_test", "\"" + getBranchKeyTest() + "\""

    }
    buildTypes {
        release {
            manifestPlaceholders += [crashlyticsEnabled: "${enableCrashlyticsInReleaseBuild}"]
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField('String', "CLARITY_ID", "\"" + getClarityId() + "\"");
            buildConfigField("String", "Secreat_Key", "\"" + getSecreatKey() + "\"");
            buildConfigField("String", "API_KEY", "\"" + getApiKey() + "\"");
            buildConfigField("String", "PLACES_API_KEY", "\"" + getMapPlacesApiKey() + "\"");
            buildConfigField("String", "EVENT_SECRET_KEY", "\"" + getEventSecretKey() + "\"");
            buildConfigField("String", "RAZORPAY_KEY_ID", "\"" + getRazorpayKeyId() + "\"");
        }
        debug {
            manifestPlaceholders += [crashlyticsEnabled: "${enableCrashlyticsInDebugBuild}"]

            buildConfigField("String", "Secreat_Key", "\"" + getSecreatKey() + "\"");
            buildConfigField("String", "API_KEY", "\"" + getApiKey() + "\"");
            buildConfigField("String", "PLACES_API_KEY", "\"" + getMapPlacesApiKey() + "\"");
            buildConfigField("String", "EVENT_SECRET_KEY", "\"" + getEventSecretKey() + "\"");
            buildConfigField("String", "RAZORPAY_KEY_ID", "\"" + getRazorpayKeyId() + "\"");
            buildConfigField("String", "Secreat_Key_Prod", "\"" + getSecretKeyProd() + "\"");
            buildConfigField('String', "CLARITY_ID", "\"" + getClarityId() + "\"");
        }
        configureEach {
            crunchPngs = false
        }

    }

    productFlavors {
        demo {
            dimension "env"
            applicationIdSuffix ".reelsdemo"
            versionNameSuffix "-isolated-demo"
            buildConfigField 'String', 'BASE_URL', '"https://demo.invalid"'
            buildConfigField 'boolean', 'APP_UPDATE_POPUP', 'false'
            buildConfigField 'String', 'BASE_URL_DEV', '"https://demo.invalid"'
            buildConfigField 'String', 'BASE_URL_STAGE', '"https://demo.invalid"'
            buildConfigField 'String', 'BASE_URL_PROD', '"https://demo.invalid"'
            buildConfigField 'boolean', 'REELS_DEMO', 'true'
        }
        prod {
            dimension "env"
            applicationId "arivihan.technologies.doubtbuzzter2"
            buildConfigField 'String', 'BASE_URL', prodBaseUrl
            buildConfigField "boolean", "APP_UPDATE_POPUP", "true"
            buildConfigField 'String', 'BASE_URL_DEV', devBaseUrl
            buildConfigField 'String', 'BASE_URL_STAGE', stageBaseUrl
            buildConfigField 'String', 'BASE_URL_PROD', prodBaseUrl
        }
        dev {
            dimension "env"
            applicationId "arivihan.technologies.doubtbuzzter2"
//            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField 'String', 'BASE_URL', devBaseUrl
            buildConfigField "boolean", "APP_UPDATE_POPUP", "false"
            buildConfigField 'String', 'BASE_URL_DEV', devBaseUrl
            buildConfigField 'String', 'BASE_URL_STAGE', stageBaseUrl
            buildConfigField 'String', 'BASE_URL_PROD', prodBaseUrl
        }
        dev2 {
            dimension "env"
            applicationId "arivihan.technologies.doubtbuzzter2"
//            applicationIdSuffix ".dev2"
            versionNameSuffix "-dev2"
            buildConfigField 'String', 'BASE_URL', dev2BaseUrl
            buildConfigField "boolean", "APP_UPDATE_POPUP", "false"
            buildConfigField 'String', 'BASE_URL_DEV', devBaseUrl
            buildConfigField 'String', 'BASE_URL_STAGE', stageBaseUrl
            buildConfigField 'String', 'BASE_URL_PROD', prodBaseUrl
        }
        stage {
            dimension "env"
            applicationId "arivihan.technologies.doubtbuzzter2"
//            applicationIdSuffix ".stage"
            versionNameSuffix "-stage"
            buildConfigField 'String', 'BASE_URL', stageBaseUrl
            buildConfigField "boolean", "APP_UPDATE_POPUP", "false"
            buildConfigField 'String', 'BASE_URL_DEV', devBaseUrl
            buildConfigField 'String', 'BASE_URL_STAGE', stageBaseUrl
            buildConfigField 'String', 'BASE_URL_PROD', prodBaseUrl
        }
        stage2 {
            dimension "env"
            applicationId "arivihan.technologies.doubtbuzzter2"
//            applicationIdSuffix ".stage2"
            versionNameSuffix "-stage2"
            buildConfigField 'String', 'BASE_URL', stage2BaseUrl
            buildConfigField "boolean", "APP_UPDATE_POPUP", "false"
            buildConfigField 'String', 'BASE_URL_DEV', devBaseUrl
            buildConfigField 'String', 'BASE_URL_STAGE', stageBaseUrl
            buildConfigField 'String', 'BASE_URL_PROD', prodBaseUrl
        }
    }
    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }


    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }


    buildFeatures {
        buildConfig = true
        viewBinding = true
        dataBinding = true
        compose = true
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    namespace = 'arivihan.technologies.doubtbuzzter2'
    lint {
        abortOnError = false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def date = new Date().format('dd-MM-YYYY-HHmm')
            def formattedVersion = variant.versionName.replaceAll('\\.', '')
            outputFileName = "arivihan_${formattedVersion}_${date}-${variant.name}.apk"
        }
    }
}

static def getClarityId() {
    def Properties props = new Properties()
    props.load(new FileInputStream(new File('secrete.properties')))
    return props['CLARITY_ID']
}

static def getSecreatKey() {
    def Properties props = new Properties()
    props.load(new FileInputStream(new File('secrete.properties')))
    return props['SECREAT_KEY']
}

