dependencies {
    implementation 'androidx.compose.foundation:foundation-layout:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.ui:ui-graphics:1.11.4'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
//    implementation 'androidx.core:core-ktx:1.19.0'
//    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'
//    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testImplementation 'org.testng:testng:7.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // Installs the packaged Baseline Profile on API 28-30, where the platform does not do it
    // itself. Required for a Baseline Profile to actually take effect on those releases.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    // Points the generate*BaselineProfile tasks at the generator module. Without this the tasks
    // succeed silently without producing a profile.
    if (rootProject.findProject(':baselineprofile') != null) baselineProfile(project(':baselineprofile'))
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'com.karumi:dexter:6.2.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.firebase:firebase-database:22.0.0'
    implementation 'com.firebase:firebase-client-android:2.5.2'
    implementation 'com.google.firebase:firebase-firestore:26.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.firebase:firebase-auth:24.0.1'
    implementation 'com.google.firebase:firebase-storage:22.0.0'
    implementation 'com.firebaseui:firebase-ui-auth:9.0.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-messaging:25.0.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.2.0'
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'
    implementation 'com.firebaseui:firebase-ui-database:9.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.TutorialsAndroid:VSpot:v2.2.19'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    implementation 'com.android.volley:volley:1.2.1'
    //noinspection GradleDynamicVersion
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    // Declare the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-config'
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation "androidx.media3:media3-session:1.8.0"
    implementation 'androidx.media3:media3-datasource-cronet:1.8.0'
    implementation 'org.jsoup:jsoup:1.21.2'

    //Lottie
    implementation "com.airbnb.android:lottie:6.6.7"
    implementation "com.airbnb.android:lottie-compose:6.6.7"

    implementation 'com.google.firebase:firebase-inappmessaging-display'

    //added by Raj Kishan
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    //noinspection PlaySdkIndexNonCompliant will check later
    implementation "com.facebook.android:facebook-common:18.0.3"
    implementation 'com.github.fornewid:neumorphism:0.2.1'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.MikeOrtiz:TouchImageView:3.6'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.shts:StoriesProgressView:2.0.0'
    implementation 'com.google.firebase:firebase-perf'

    implementation "androidx.room:room-runtime:2.7.2"
    annotationProcessor "androidx.room:room-compiler:2.7.2"
    implementation 'com.gu.android:toolargetool:0.3.2'
    //noinspection NewerVersionAvailable failing with new version
    implementation 'com.razorpay:checkout:1.6.40'

    implementation 'androidx.work:work-runtime:2.10.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'com.github.mancj:SlimChart:0.1.2'
    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.2'
    implementation("com.google.firebase:firebase-appcheck-playintegrity")
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.apache.commons:commons-text:1.14.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'

    // Google's Flexbox - for wrapping ui elements
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'io.github.afreakyelf:Pdf-Viewer:2.4.0'

    implementation "com.android.installreferrer:installreferrer:2.2"

    // Google Places API
    implementation 'com.google.android.libraries.places:places:3.5.0'

    implementation files('libs/android-image-cropper-2.8.0.aar')
    implementation files('libs/pageindicatorview-1.0.2.aar')

    implementation('de.keyboardsurfer.android.widget:crouton:1.8.5@aar') {
        // exclusion is not necessary, but generally a good idea.
        exclude group: 'com.google.android', module: 'support-v4'
    }

    testImplementation 'org.codehaus.groovy:groovy-all:3.0.25'

    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.runtime:runtime-livedata'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

//    annotationProcessor 'org.projectlombok:lombok:1.18.38'
//    implementation 'org.projectlombok:lombok:1.18.38'

    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.3'
    implementation 'androidx.navigation:navigation-ui:2.9.3'
    //noinspection Aligned16KB will do later
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.github.douglasjunior:android-simple-tooltip:1.1.0'
    implementation 'com.facebook.android:facebook-android-sdk:18.0.3'

    implementation 'com.google.android.gms:play-services-location:21.0.1'

    implementation 'com.truecaller.android.sdk:truecaller-sdk:3.2.1'


    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'
    implementation 'io.branch.sdk.android:library:5.21.1'
    implementation 'store.galaxy.samsung.installreferrer:samsung_galaxystore_install_referrer:4.0.0'

    // Hilt.
    // hilt-compiler runs through KSP, NOT kapt: kapt compiles Java with -proc:none,
    // which stops Lombok / Room / Glide from running and breaks the data binding
    // processor. KSP leaves javac's annotation processors alone, but it only sees
    // Kotlin sources — so @HiltAndroidApp / @Module / @AndroidEntryPoint / @Inject
    // must sit on Kotlin classes. Java classes can still consume the graph through
    // NetworkEntryPoint (see di/).
    implementation 'com.google.dagger:hilt-android:2.56.2'
    ksp 'com.google.dagger:hilt-compiler:2.56.2'

    // required by Retrofit's suspend support
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Jetpack Compose (used by the topper notes screen)
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // material-icons-core (included with material3) already has Check, CheckCircle,
    // Close, Share, PlayArrow — no need for the extended set which adds thousands
    // of icons and massively slows KSP/Compose compilation
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Retrofit + OkHttp (see arivihan.technologies.doubtbuzzter2.network)
    implementation platform('com.squareup.okhttp3:okhttp-bom:4.12.0')
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.squareup.okhttp3:logging-interceptor'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation('com.squareup.retrofit2:converter-gson:2.11.0') {
        // project already pins its own Gson version above
        exclude group: 'com.google.code.gson', module: 'gson'
    }

}

