// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" }

        maven {
            url = "https://maven.mozilla.org/maven2/"
        }
    }
    
    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.4.3'

        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.4'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0'
        classpath "androidx.room:room-gradle-plugin:2.7.2"

        // Generates and packages the Baseline Profile - see BASELINE_PROFILE_SETUP.md
        classpath 'androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1'

        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.56.2'
        // version must track the Kotlin plugin version above
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.1.0-1.0.29'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files


    }
}

